server:
  port: 8082
spring:
  application:
    name: inventory-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  datasource:
    url: ${INVENTORY_DB_URL:jdbc:postgresql://localhost:5434/inventorydb}
    username: ${DB_USER:shop}
    password: ${DB_PASSWORD:shop}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 30000
    consumer:
      group-id: inventory-service
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

inventory:
  reservation:
    ttl: PT45M      # must exceed order-service saga.payment-timeout
    atomic: false   # true = single atomic UPDATE for hot SKUs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
