# Infra only (default):        docker compose up -d
# Infra + all services:        docker compose --profile apps up -d --build
name: ecommerce

x-app-env: &app-env
  CONFIG_SERVER_URL: http://config-server:8888
  EUREKA_URL: http://discovery-server:8761/eureka
  KAFKA_BOOTSTRAP: kafka:9092
  DB_USER: shop
  DB_PASSWORD: shop

x-pg: &pg
  image: postgres:16-alpine
  environment: &pg-env
    POSTGRES_USER: shop
    POSTGRES_PASSWORD: shop
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U shop"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  # ---------------- infrastructure ----------------
  postgres-order:
    <<: *pg
    environment: { <<: *pg-env, POSTGRES_DB: orderdb }
    ports: ["5433:5432"]
    volumes: [pg-order:/var/lib/postgresql/data]

  postgres-inventory:
    <<: *pg
    environment: { <<: *pg-env, POSTGRES_DB: inventorydb }
    ports: ["5434:5432"]
    volumes: [pg-inventory:/var/lib/postgresql/data]

  postgres-payment:
    <<: *pg
    environment: { <<: *pg-env, POSTGRES_DB: paymentdb }
    ports: ["5435:5432"]
    volumes: [pg-payment:/var/lib/postgresql/data]

  kafka:
    image: apache/kafka:3.8.0
    ports: ["29092:29092"]            # host access; containers use kafka:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # ---------------- platform services (profile: apps) ----------------
  config-server:
    profiles: [apps]
    build: { context: ., args: { MODULE: config-server } }
    ports: ["8888:8888"]

  discovery-server:
    profiles: [apps]
    build: { context: ., args: { MODULE: discovery-server } }
    environment: { EUREKA_HOST: discovery-server }
    ports: ["8761:8761"]

  api-gateway:
    profiles: [apps]
    build: { context: ., args: { MODULE: api-gateway } }
    ports: ["8080:8080"]
    environment:
      <<: *app-env
      REDIS_HOST: redis
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET:-dev-only-shared-secret-change-me-0123456789abcdef}
    depends_on: [discovery-server, config-server, redis]

  order-service:
    profiles: [apps]
    build: { context: ., args: { MODULE: order-service } }
    ports: ["8081:8081"]
    environment:
      <<: *app-env
      ORDER_DB_URL: jdbc:postgresql://postgres-order:5432/orderdb
    depends_on:
      postgres-order: { condition: service_healthy }
      kafka: { condition: service_started }
      discovery-server: { condition: service_started }

  inventory-service:
    profiles: [apps]
    build: { context: ., args: { MODULE: inventory-service } }
    ports: ["8082:8082"]
    environment:
      <<: *app-env
      INVENTORY_DB_URL: jdbc:postgresql://postgres-inventory:5432/inventorydb
    depends_on:
      postgres-inventory: { condition: service_healthy }
      kafka: { condition: service_started }
      discovery-server: { condition: service_started }

  payment-service:
    profiles: [apps]
    build: { context: ., args: { MODULE: payment-service } }
    ports: ["8083:8083"]
    environment:
      <<: *app-env
      PAYMENT_DB_URL: jdbc:postgresql://postgres-payment:5432/paymentdb
      PSP_BASE_URL: http://localhost:8083/mock-psp
    depends_on:
      postgres-payment: { condition: service_healthy }
      kafka: { condition: service_started }
      discovery-server: { condition: service_started }

volumes:
  pg-order:
  pg-inventory:
  pg-payment:
